name: Build JevJarvis iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify build package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/JevJarvis-iOS-云编译包.zip"
          test -f "$ZIP"
          echo "Build package: $ZIP"
          ls -lh "$ZIP"

      - name: Install CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          if command -v pod >/dev/null 2>&1; then
            pod --version
          else
            sudo gem install cocoapods --no-document
            pod --version
          fi

      - name: Unpack iOS source
        shell: bash
        run: |
          set -euo pipefail
          export SRC_ROOT="$RUNNER_TEMP/JevJarvis-iOS-src"
          rm -rf "$SRC_ROOT"
          mkdir -p "$SRC_ROOT"

          unzip -q "$GITHUB_WORKSPACE/JevJarvis-iOS-云编译包.zip" -d "$SRC_ROOT"

          # Some cloud build packages contain another archive inside the outer ZIP.
          # Expand nested archives until an Xcode project/workspace or Podfile is visible.
          for depth in 1 2 3; do
            FOUND_XCODE="$(find "$SRC_ROOT" -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print -quit || true)"
            FOUND_PODFILE="$(find "$SRC_ROOT" -type f -name "Podfile" -print -quit || true)"
            if [ -n "$FOUND_XCODE" ] || [ -n "$FOUND_PODFILE" ]; then
              break
            fi

            NESTED_ZIPS="$(find "$SRC_ROOT" -type f -name "*.zip" -print)"
            if [ -z "$NESTED_ZIPS" ]; then
              break
            fi

            while IFS= read -r nested_zip; do
              [ -n "$nested_zip" ] || continue
              dest="${nested_zip%.zip}"
              mkdir -p "$dest"
              echo "Expanding nested archive: $nested_zip"
              unzip -q "$nested_zip" -d "$dest"
              rm -f "$nested_zip"
            done <<< "$NESTED_ZIPS"
          done

          echo "Xcode/Podfile candidates:"
          find "$SRC_ROOT" -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print | sort || true
          find "$SRC_ROOT" -type f -name "Podfile" -print | sort || true

          if ! find "$SRC_ROOT" -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print -quit | grep -q . &&              ! find "$SRC_ROOT" -type f -name "Podfile" -print -quit | grep -q .; then
            echo "No Xcode project/workspace or Podfile was found after extraction."
            echo "Full extracted file manifest:"
            find "$SRC_ROOT" -type f -print | sort
            exit 1
          fi

      - name: Disable App Group configuration
        shell: bash
        run: |
          set -euo pipefail
          export SRC_ROOT="$RUNNER_TEMP/JevJarvis-iOS-src"

          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path(os.environ["SRC_ROOT"])
          entitlement_hits = 0
          project_hits = 0

          for path in root.rglob("*.entitlements"):
              try:
                  xml = subprocess.check_output(
                      ["plutil", "-convert", "xml1", "-o", "-", str(path)],
                      text=True,
                  )
              except subprocess.CalledProcessError:
                  print(f"Skipping unreadable entitlements: {path}")
                  continue

              pattern = re.compile(
                  r'(?ms)^([ \t]*)<key>com\.apple\.security\.application-groups</key>\s*'
                  r'<array>.*?</array>\s*'
              )
              if not pattern.search(xml):
                  continue

              replacement = (
                  "<!-- App Group disabled for unsigned/self-signable build: "
                  "com.apple.security.application-groups -->\n"
              )
              xml2, count = pattern.subn(replacement, xml, count=1)
              if count:
                  path.write_text(xml2, encoding="utf-8")
                  entitlement_hits += 1
                  print(f"Disabled App Group entitlement: {path}")

          for path in root.rglob("project.pbxproj"):
              text = path.read_text(encoding="utf-8", errors="replace")
              pattern = re.compile(
                  r'^(\s*)com\.apple\.ApplicationGroups\.enabled\s*=\s*(?:1|YES)\s*;',
                  re.MULTILINE,
              )
              text2, count = pattern.subn(
                  r'\1// App Group disabled for unsigned/self-signable build: com.apple.ApplicationGroups.enabled = 1;',
                  text,
              )
              if count:
                  path.write_text(text2, encoding="utf-8")
                  project_hits += count
                  print(f"Disabled App Group project capability: {path} ({count} occurrence(s))")

          print(f"App Group entitlements changed: {entitlement_hits}")
          print(f"App Group project capability entries changed: {project_hits}")

          remaining = []
          for path in root.rglob("*.entitlements"):
              text = path.read_text(encoding="utf-8", errors="replace")
              if "com.apple.security.application-groups" in text and "<key>com.apple.security.application-groups</key>" in text:
                  remaining.append(str(path))
          for path in root.rglob("project.pbxproj"):
              text = path.read_text(encoding="utf-8", errors="replace")
              if re.search(
                  r'^\s*com\.apple\.ApplicationGroups\.enabled\s*=\s*(?:1|YES)\s*;',
                  text,
                  re.MULTILINE,
              ):
                  remaining.append(str(path))

          if remaining:
              print("Remaining active App Group configuration:")
              for item in remaining:
                  print(f"  {item}")
              raise SystemExit(1)

          print("App Group configuration check passed.")
          PY

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          export SRC_ROOT="$RUNNER_TEMP/JevJarvis-iOS-src"

          PODFILE="$(find "$SRC_ROOT" -type f -name Podfile -print -quit || true)"
          WORKSPACE="$(find "$SRC_ROOT" -type d -name "*.xcworkspace" ! -path "*/.xcodeproj/*" -print -quit || true)"
          PROJECT="$(find "$SRC_ROOT" -type d -name "*.xcodeproj" -print -quit || true)"

          if [ -n "$PODFILE" ]; then
            PROJECT_ROOT="$(dirname "$PODFILE")"
          elif [ -n "$WORKSPACE" ]; then
            PROJECT_ROOT="$(dirname "$WORKSPACE")"
          elif [ -n "$PROJECT" ]; then
            PROJECT_ROOT="$(dirname "$PROJECT")"
          else
            echo "No Xcode project/workspace or Podfile found under $SRC_ROOT"
            echo "Full extracted file manifest:"
            find "$SRC_ROOT" -type f -print | sort
            exit 1
          fi

          if [ -n "$WORKSPACE" ]; then
            BUILD_CONTAINER="workspace"
            BUILD_FILE="$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            BUILD_CONTAINER="project"
            BUILD_FILE="$PROJECT"
          else
            echo "No buildable .xcworkspace or .xcodeproj found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "BUILD_CONTAINER=$BUILD_CONTAINER" >> "$GITHUB_ENV"
          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"

          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "BUILD_CONTAINER=$BUILD_CONTAINER"
          echo "BUILD_FILE=$BUILD_FILE"

      - name: Run pod install
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile found; skipping pod install."
          fi

      - name: Detect Release scheme
        shell: bash
        run: |
          set -euo pipefail

          SCHEME=""
          SCHEME_FILE=""

          if [ "$BUILD_CONTAINER" = "project" ]; then
            SCHEME_FILE="$(find "$BUILD_FILE/xcshareddata/xcschemes" -type f -name "*.xcscheme" -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$SCHEME_FILE" ]; then
            SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
            echo "Using shared Xcode scheme: $SCHEME"
          else
            if [ "$BUILD_CONTAINER" = "workspace" ]; then
              LIST_OUTPUT="$(xcodebuild -workspace "$BUILD_FILE" -list 2>&1)"
            else
              LIST_OUTPUT="$(xcodebuild -project "$BUILD_FILE" -list 2>&1)"
            fi

            printf '%s\n' "$LIST_OUTPUT" | tee "$RUNNER_TEMP/xcode-list.log"

            SCHEME="$(printf '%s\n' "$LIST_OUTPUT" | awk '
              /^Schemes:/ { found=1; next }
              found && NF { gsub(/^[ \t]+|[ \t]+$/, ""); print; exit }
            ')"
          fi

          if [ -z "$SCHEME" ] && [ "$BUILD_CONTAINER" = "project" ]; then
            SCHEME="$(basename "$BUILD_FILE" .xcodeproj)"
            echo "Falling back to project name as scheme: $SCHEME"
          fi

          test -n "$SCHEME"

          if [ "$BUILD_CONTAINER" = "workspace" ]; then
            xcodebuild -workspace "$BUILD_FILE" -scheme "$SCHEME" -showBuildSettings >/dev/null
          else
            xcodebuild -project "$BUILD_FILE" -scheme "$SCHEME" -showBuildSettings >/dev/null
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Selected scheme: $SCHEME"

      - name: Build Release archive without signing
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/JevJarvis-Release.xcarchive"
          rm -rf "$ARCHIVE_PATH"

          COMMON_ARGS=(
            -scheme "$SCHEME"
            -configuration Release
            -archivePath "$ARCHIVE_PATH"
            -sdk iphoneos
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            DEVELOPMENT_TEAM=""
            PROVISIONING_PROFILE_SPECIFIER=""
          )

          if [ "$BUILD_CONTAINER" = "workspace" ]; then
            xcodebuild -workspace "$BUILD_FILE" \
              "${COMMON_ARGS[@]}" \
              clean archive
          else
            xcodebuild -project "$BUILD_FILE" \
              "${COMMON_ARGS[@]}" \
              clean archive
          fi

          test -d "$ARCHIVE_PATH"
          find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name "*.app" -print

          APP_PATH="$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name "*.app" -print -quit)"
          test -n "$APP_PATH"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA_ROOT="$RUNNER_TEMP/ipa"
          IPA_PATH="$RUNNER_TEMP/JevJarvis-Release-unsigned.ipa"

          rm -rf "$IPA_ROOT" "$IPA_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/"

          (
            cd "$IPA_ROOT"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-iOS-Release-unsigned-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-iOS-build-logs
          path: |
            ${{ runner.temp }}/JevJarvis-Release.xcarchive/Info.plist
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
